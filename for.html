
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>for</title>
</head>
<body>
<script>
let numero = Number(prompt("Ingresa un número para la tabla:"));

for (let i = 1; i <= 10; i++) {
    console.log(numero + " x " + i + " = " + (numero * i));
}
</script>
</body>
</html>

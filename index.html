

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Edad</title>
</head>
<body>
<script>
    let fechaActual = 2025;
    let fechaUsuario = prompt("¡Hola! Por favor, introduce tu año de nacimiento:");

    let edadUsuario = fechaActual - Number(fechaUsuario);

    alert("Usted tiene: " + edadUsuario);
</script>
</body>
</html>

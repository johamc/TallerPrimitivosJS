
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>while</title>
</head>
<body>
<script>
let contraseña = prompt("Ingrese la contraseña:");

while (contraseña !== "1234") {
    contraseña = prompt("Contraseña incorrecta. Intente de nuevo:");
}

console.log("Contraseña correcta");
</script>
</body>
</html>
